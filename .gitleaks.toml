[extend]
useDefault = true

[[rules]]
id = "aws-account-id-in-arn"
description = "AWS account ID inside an ARN"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:\d{12}:'''

[[rules]]
id = "aws-account-id-assignment"
description = "AWS account ID assigned to an account-like key"
regex = '''(?i)(account|acct)[_-]?(id)?["']?\s*[:=]\s*["']?\d{12}\b'''
